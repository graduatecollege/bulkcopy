name: Dependabot Tests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    if: github.actor == 'dependabot[bot]'
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # ratchet:actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test BulkCopy.Tests/BulkCopy.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Run integration tests
        run: >-
          dotnet test BulkCopy.IntegrationTests/BulkCopy.IntegrationTests.csproj
          --configuration Release --no-build --verbosity normal
