name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  test-unit:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # ratchet:actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test BulkCopy.Tests/BulkCopy.Tests.csproj
          --configuration Release --no-build --verbosity normal

  test-integration:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # ratchet:actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run integration tests
        run: >
          dotnet test
          BulkCopy.IntegrationTests/BulkCopy.IntegrationTests.csproj
          --configuration Release --no-build --verbosity normal

  build:
    name: Build Binaries
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: linux-x64
            artifact-name: bulkcopy-linux-x64
          - runtime: win-x64
            artifact-name: bulkcopy-win-x64
          - runtime: osx-x64
            artifact-name: bulkcopy-osx-x64
          - runtime: osx-arm64
            artifact-name: bulkcopy-osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # ratchet:actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish binary
        run: |
          dotnet publish BulkCopy/BulkCopy.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --property:PublishSingleFile=true \
            --property:PublishTrimmed=true \
            --output ./publish/${{ matrix.runtime }}

      - name: Create archive (Linux/macOS)
        if: >
          startsWith(matrix.runtime, 'linux-') ||
          startsWith(matrix.runtime, 'osx-')
        run: |
          cd ./publish/${{ matrix.runtime }}
          tar -czf ../${{ matrix.artifact-name }}.tar.gz *

      - name: Create archive (Windows)
        if: startsWith(matrix.runtime, 'win-')
        run: |
          cd ./publish/${{ matrix.runtime }}
          zip -r ../${{ matrix.artifact-name }}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ./publish/${{ matrix.artifact-name }}.tar.gz
            ./publish/${{ matrix.artifact-name }}.zip
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # ratchet:softprops/action-gh-release@v3.0.2
        with:
          files: |
            ./artifacts/bulkcopy-linux-x64/*.tar.gz
            ./artifacts/bulkcopy-win-x64/*.zip
            ./artifacts/bulkcopy-osx-x64/*.tar.gz
            ./artifacts/bulkcopy-osx-arm64/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
